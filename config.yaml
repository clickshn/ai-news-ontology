# =============================================================================
# ai-news-ontology 설정
# -----------------------------------------------------------------------------
# 여기에는 "비밀이 아닌" 설정만 둔다. API 키·Vault 경로 등은 .env 로 분리한다.
#
# [중요] 통제어휘(controlled_vocabulary)의 단일 출처(SSoT)는
#        extraction/schema.py 의 Enum 이다. 아래 목록은 사람이 읽고 리뷰하기
#        위한 미러이며, tests/test_vocab_sync.py 가 두 곳의 일치를 검증한다.
#        → 어휘를 바꿀 때는 반드시 schema.py 와 이 파일을 함께 수정할 것.
#        (근거: README 결정 로그 D-002)
# =============================================================================

version: 1

# --- 1. 수집 소스 ------------------------------------------------------------
sources:
  rss:
    # - name: 사람이 읽는 이름 / url: 피드 주소 / tags: 기본 힌트 태그
    #   ("ko" 는 export 계약의 lang 을 정한다 — export/record.py: declared_lang)
    #   body_quality: full | truncated | oneline | partial | title_only
    #   limits: 실행당 호출 상한 {gate, extract}. **CLI 로 하나라도 주면 이 값 전체가
    #           대체된다** (ADR-023). 전역 천장 기본값은 이 값들의 합이다 (D-102)
    #   max_silence_days: 가장 최근 발행일이 이보다 오래되면 갱신 멈춤으로 보고 소스
    #           단위 실패로 센다. 200 을 주면서 멈춘 피드를 잡는다 (ADR-023)
    #   naive_date_offset: 시간대 표기 없는 발행일을 읽을 UTC 오프셋. 없으면 UTC 로
    #           읽고 경고한다. 표기가 있는 값에는 쓰지 않는다 (ADR-023)
    #
    # 2026-09-29 실측 (session-16). 본문은 앞 50건(피드가 50건 미만이면 전부),
    # 총건수는 피드가 주는 전체, 7일은 발행일 기준:
    #
    #   소스                     총건수  최소  중앙   최대  0자   7일  최신
    #   arXiv cs.CL (Atom API)      20  1068  1508  1919    0    20  09-26
    #   OpenAI News               1234    84   144   250    0    19  09-29
    #   Google DeepMind Blog       100     0    79   210   21     3  09-24
    #   NVIDIA Developer           100   164   562   573    0    12  09-28
    #   Microsoft Research          10  4000  4000  4000    0     2  09-28
    #   AI타임스 (gn)               50   478  1457  3406    0    50  09-29
    #   인공지능신문                50   299   300   300    0    50  09-29   (은퇴, D-107)
    #
    # 발행일 없는 항목: 전 소스 0건. 최댓값 4000 은 수집기의 BODY_MAX_CHARS 에서 잘린 것.
    #
    # 제외 (D-105):
    #   GeekNews            — 중앙값 160자, 비-AI 약 40%. 기존 골든셋·노트는 유지(소급 제거 없음)
    #   Hugging Face Blog   — 50/50건 0자. 제목만으로는 추출 품질이 안 나온다
    #   Google Research     — 중앙값 19자 (같은 기준)
    #   Mistral AI          — 50건 중 29건 0자
    #   NVIDIA Blog         — 비-AI(게이밍) 혼재. NVIDIA Developer 로 충분
    #   전자신문 AI         — 보류. 250자 잘림이라 인공지능신문을 뺀 기준(D-107)에 같이 걸린다
    #   Meta AI · ZDNet Korea — 쓸 수 있는 피드 없음 (ZDNet 레거시 경로는 2024-05-10 에 멈춤)
    #   Anthropic           — 공식 피드 없음. 비공식 중계 3종은 모델 출시 글 누락·404 링크·
    #                         제목 오염이 관측돼 넣지 않는다

    # arXiv Atom API. RSS 공지 피드(rss.arxiv.org)는 주말/공휴일에 0건이라
    # 슬라이스 검증에 못 쓴다. API 쿼리는 언제든 최근 논문 + 초록 전문을 준다.
    # published 는 제출일이라 게시보다 3일 이상 늦다 — 전역 창 7일이 흡수한다.
    - name: "arXiv cs.CL (Atom API)"
      url: "http://export.arxiv.org/api/query?search_query=cat:cs.CL&sortBy=submittedDate&sortOrder=descending&max_results=20"
      tags: ["paper"]
      body_quality: "full"        # 초록 전문
      limits: {gate: 20, extract: 10}   # 피드가 한 번에 20건만 준다
      max_silence_days: 5         # 제출일 기준 + 주말

    - name: "OpenAI News"
      url: "https://openai.com/news/rss.xml"
      tags: ["vendor"]
      body_quality: "oneline"     # 한 줄 설명
      limits: {gate: 10, extract: 5}    # 7일 19건
      max_silence_days: 7

    # 2026-09-29: plan 실패 / run 성공 불일치의 원인은 요청하지 않은 gzip 이었다 (D-104).
    - name: "Google DeepMind Blog"
      url: "https://deepmind.google/blog/rss.xml"
      tags: ["vendor"]
      body_quality: "partial"     # 50건 중 21건 0자. 편차가 크다
      limits: {gate: 5, extract: 3}     # 7일 3건
      max_silence_days: 21        # 100건이 약 11개월치

    - name: "NVIDIA Developer"
      url: "https://developer.nvidia.com/blog/feed/"
      tags: ["vendor"]
      body_quality: "truncated"   # 요약 약 560자
      limits: {gate: 10, extract: 5}    # 7일 12건
      max_silence_days: 7

    # /research/feed/ 와 내용이 같다(2026-09-29). 블로그 쪽이 이름대로다.
    - name: "Microsoft Research"
      url: "https://www.microsoft.com/en-us/research/blog/feed/"
      tags: ["vendor"]
      body_quality: "full"        # 전문 (4000자에서 잘림)
      limits: {gate: 5, extract: 3}     # 피드가 10건(약 2개월치)만 준다
      max_silence_days: 30

    # gn 판을 쓴다. 일반 판(/rss/allArticle.xml)은 같은 기사를 300자에서 자르고
    # 발행일에 시간대가 없다. gn 판은 `+0900` 을 준다.
    # ⚠️ 피드가 최근 50건(약 2~3일치)만 준다 — 3일 넘게 쉬면 그 사이 글은 복구되지 않는다.
    - name: "AI타임스"
      url: "https://cdn.aitimes.com/rss/gn_rss_allArticle.xml"
      tags: ["ko", "media"]
      body_quality: "truncated"   # 중앙값 1457자
      limits: {gate: 40, extract: 15}   # 하루 신규 약 38건
      max_silence_days: 2

  # 수집을 멈춘 소스. **수집하지 않는다.** 제외는 앞으로만이라(D-105) 이미 들어온
  # 골든셋·노트·보존소 항목은 그대로이고, eval.predict 가 골든셋 URL 의 호스트로 소스
  # 이름을 유도할 때 여기를 본다 — 지우면 GeekNews 골든셋 2건의 재추출이 멈춘다.
  retired:
    - name: "GeekNews"
      url: "https://news.hada.io/rss/news"
      tags: ["ko", "aggregator"]
      retired_on: "2026-09-29"
      reason: "본문 중앙값 160자, 비-AI 약 40% (D-105)"

    - name: "Hugging Face Blog"
      url: "https://huggingface.co/blog/feed.xml"
      tags: ["oss"]
      retired_on: "2026-09-29"
      reason: "50/50건 본문 0자 (D-105)"

    # 소표본(2026-09-29)에서 300자 본문이 추출을 흔들었다: 관련기존기술을 본문 근거
    # 없이 채움(Liquid Cooling), 같은 사건을 AI타임스(3167자)는 ProductLaunch 로 보는데
    # Community/Discussion 으로 분류, 562자 소스는 잘림을 유보했는데 300자는 확신 (D-107).
    - name: "인공지능신문"
      url: "https://www.aitimes.kr/rss/allArticle.xml"
      tags: ["ko", "media"]
      naive_date_offset: "+09:00"
      retired_on: "2026-09-29"
      reason: "300자 잘림 본문에서 근거 없는 채움·분류 흔들림 (D-107)"

  arxiv:
    # arXiv API 로 최근 N일 논문을 가져올 카테고리
    categories:
      - "cs.CL"   # Computation and Language
      - "cs.LG"   # Machine Learning
      - "cs.AI"   # Artificial Intelligence
      - "cs.IR"   # Information Retrieval (RAG 관련)
      - "cs.MA"   # Multiagent Systems
    lookback_days: 3
    max_results_per_category: 50

  # (config 의 `sources.arxiv` 는 코드에서 쓰지 않는다 — collectors/README.md)

# --- 1-1. 매일 실행의 수용 창 (ADR-023) ----------------------------------------
# 원장에 **처음 들어오는** 항목만 발행일로 거른다. 재실행 중복은 원장이 거르므로
# 다시 보는 비용은 0 이고, 창이 막는 것은 첫 수용 범위 하나다.
#   span = 첫 실행이면 lookback_days,
#          아니면 min(max(lookback_days, 소스별 마지막 완결 실행 이후 일수 + overlap_days), max_lookback_days)
# 이 절을 지우면 창이 꺼진다(전량 수용).
pipeline:
  window:
    lookback_days: 7          # arXiv 의 게시 지연(3일+)을 흡수한다 — 소스별 창을 두지 않는 이유
    overlap_days: 1           # 시간대 ±1일
    max_lookback_days: 14     # 첫 실행이 아니라 "오래 쉰 뒤"의 상한
    undated_max_per_run: 5    # 발행일 없음·미래 날짜는 피드 순서로 소스당 이만큼만

# --- 1-2. 매일 자동 실행 (ADR-025) ----------------------------------------------
# `python -m pipeline scheduled` 가 읽는다. 수동 `run` 은 이 절을 보지 않는다.
# ⚠️ **config 상한(sources.rss[].limits)은 상시 승인이 아니다.** 자동 실행은
#    `.claude/scheduled-run-approved.json`(사람이 `approve-schedule` 로 만든다)과
#    목적지·모델·프롬프트·소스·상한·목적지 결정 코드를 대조하고, 다르면 멈춘다.
#    만료(14일)와 표본 수는 **여기가 아니라 코드 상수**다 — pipeline/approval.py.
schedule:
  time: null                  # "HH:MM" 로컬 시각. 사용자가 채운다. 등록 스크립트가 읽는다
  readiness:                  # 엔드포인트 TCP 연결만 본다 (HTTP·페이로드 없음). 끝까지 안 닿으면
    wait_minutes: 30          #   "환경 미준비"(종료 코드 5) — 차단기(장애)와 따로 센다.
    interval_seconds: 60      #   VPN 이 필요한 환경이면 VPN 이 붙는 시간을 여기서 흡수한다
    connect_timeout_seconds: 5
  absent_after_hours: 36      # 마지막 실행이 이보다 오래면 SessionStart 훅이 ⚠️ (실행 부재)
  toast: true                 # 심각 등급에만 Windows 토스트

# --- 2. LLM ------------------------------------------------------------------
# 단계별로 모델을 따로 지정한다. 파이프라인 앞단(relevance_gate)은 "분석할 가치가
# 있는가"만 판정하므로 저비용 모델로 충분하고, 뒷단(extraction)은 통제어휘 선택과
# 영향도 판정이 걸려 있어 고성능 모델을 쓴다. (결정 로그 D-015)
llm:
  # "vllm" = 내부 KT Cloud AI Nexus 엔드포인트(.env 의 VLLM_BASE) / "anthropic" = 외부 벤더.
  #
  # ⚠️ **"anthropic" 으로 되돌리는 것은 설정 변경이 아니라 전제 변경이다.** 이 레포가
  #    만드는 코퍼스의 소비자(MARA)는 외부 LLM 벤더 비의존이 전제이고, 그 전제가
  #    깨졌을 때 실제로 벤더를 부른 코드가 여기였다 (ADR-017, MARA ADR-021).
  #    되돌리면 extraction/egress.py 의 기본 차단이 다시 걸리고, 승인 게이트 6항목
  #    1번의 답이 "아니오"가 된다. (ADR-018, 결정 로그 D-063)
  provider: "vllm"

  vllm:
    # base_url 은 여기 적지 않는다. **엔드포인트 URL 자체가 자격증명이다**
    # (MARA ADR-010) — .env 의 VLLM_BASE 로만 주입하고 레포에는 남기지 않는다.
    # system 역할을 별도 메시지로 보낼 수 있는지는 채팅 템플릿에 달렸다.
    # gemma-4-31B-it 실측 결과는 ADR-018 Evidence 참고.
    system_as_user: false

  relevance_gate:
    model: "gemma-4-31B-it"
    # `provider: anthropic` 으로 되돌릴 때 쓰이는 벤더 모델명. 주석이 아니라
    # 키인 이유는, 주석은 롤백 시 아무 일도 하지 않기 때문이다 (D-015, F1).
    vendor_model: "claude-haiku-4-5-20251001"
    max_tokens: 1000
    # effort / thinking 은 **벤더 전용 파라미터**다. provider: vllm 에서는
    # 전달되지 않고, 켜져 있으면 클라이언트 생성 시점에 stderr 로 알린다
    # (extraction/llm.py: VENDOR_ONLY_PARAMS → vendor_only_params_in). 보내 봐야
    # 이 엔드포인트는 200 을 주고 아무 일도 하지 않는다(ADR-019) — 알리지 않으면
    # 켠 실행과 안 켠 실행이 구분되지 않는다. 벤더로 되돌릴 때를 위해 값은 남겨
    # 둔다 — Haiku 4.5 는 output_config.effort 를 거부한다(400).
    effort: null
    thinking: "disabled"         # 이분 판정이라 사고 확장이 필요 없다
    # 게이트는 재현 가능해야 한다. 미설정 시 API 기본값(1.0)이 적용돼 같은 기사가
    # 실행마다 다르게 판정된다(#33001: 5회 중 4통과/1스킵). (결정 로그 D-032)
    temperature: 0

  extraction:
    model: "gemma-4-31B-it"
    vendor_model: "claude-opus-5"   # provider: anthropic 롤백 시 쓰인다
    max_tokens: 8000
    thinking: "adaptive"         # 벤더 전용. vllm 에는 보내지 않는다
    effort: "high"               # 벤더 전용. gemma 에는 대응 파라미터가 없다
    # [주의] Opus 5 는 temperature 를 거부한다(400 "deprecated for this model").
    # vLLM 은 받으므로 게이트와 같은 이유로 0 을 쓴다 (D-032). 벤더로 되돌리면
    # 이 값은 `extraction/llm.py: MODEL_UNSUPPORTED_PARAMS` 가 빼고 stderr 로
    # 알린다 — **여기 값을 손으로 지울 필요가 없다** (D-067). **이것은 모델
    # 교체와 함께 바뀐 파라미터 차이이고, 대조 결과에 그대로 적는다** (D-063).
    temperature: 0

  eval_judge:
    # 모델명의 정본은 아래 `eval.judge_model` 이다. 여기에는 모델 외 설정만 둔다.
    max_tokens: 4000
    effort: "high"               # 벤더 전용
    temperature: 0

# --- 3. 온톨로지 통제어휘 (schema.py Enum 의 미러) -----------------------------
ontology:
  tech_domain:                   # 기술영역 — 고정 리스트, 1~3개 선택
    - LLM
    - Multimodal
    - RAG
    - Agent
    - Reasoning
    - Training/Finetuning
    - Inference/Serving
    - Infra/MLOps
    - Eval/Governance
    - Safety/Alignment
    - Data/Synthetic
    - Embodied/Robotics
    - Hardware/Chip
    - Application/Product

  release_type:                  # 발표유형 — 고정 리스트, 정확히 1개
    - Paper
    - ProductLaunch
    - OpenSource
    - Policy/Regulation
    - Funding/M&A
    - Benchmark/Report
    - Community/Discussion       # 2026-08-29 추가. 결정 로그 D-021
    - Partnership/Contract       # 2026-09-01 추가. 결정 로그 D-056

  impact:                        # 영향도 — 1~5 리커트, 근거 한 줄 병기
    scale: [1, 2, 3, 4, 5]
    require_rationale: true

# --- 4. 기업명 정규화 (alias -> canonical) ------------------------------------
# 관련기업은 자유 엔티티지만, 표기 흔들림을 여기서 흡수한다.
# 조회는 소문자·공백제거 후 매칭한다. 미등록 표기는 원문 그대로 보존하고
# observability 에 unknown_company 로 기록해 주기적으로 이 목록에 반영한다.
company_aliases:
  Anthropic: ["anthropic", "앤트로픽"]
  OpenAI: ["openai", "open ai", "오픈AI", "오픈에이아이"]
  Google DeepMind: ["deepmind", "google deepmind", "구글 딥마인드", "딥마인드"]
  Meta: ["meta", "meta ai", "facebook", "fair", "메타"]
  Microsoft: ["microsoft", "msft", "마이크로소프트"]
  NVIDIA: ["nvidia", "엔비디아"]
  Mistral AI: ["mistral", "mistral ai", "미스트랄"]
  Hugging Face: ["huggingface", "hugging face", "허깅페이스"]

# --- 5. 출력 ------------------------------------------------------------------
output:
  # .env: OBSIDIAN_VAULT_PATH 기준 상대 경로. 비워 두면 그 경로에 바로 쓴다.
  # OBSIDIAN_VAULT_PATH 가 노트 디렉터리를 직접 가리키면 비워 둔다.
  vault_subdir: ""
  # {date}=YYYY-MM-DD(처리 시각) {source}=소스명 슬러그 {slug}=제목 슬러그
  filename_template: "{date}-{source}-{slug}.md"
  # 같은 기사(source_url 일치) 노트가 이미 있을 때: skip | overwrite | version
  # 기본은 skip. Vault 는 사용자의 실제 데이터라 덮어쓰기는 명시적으로만. (D-028)
  # 제목이 비슷해 슬러그만 겹치는 경우는 별개 노트이므로 -2, -3 이 붙는다.
  on_conflict: "skip"

# --- 6. eval -----------------------------------------------------------------
eval:
  # ⚠️ judge 도 벤더 호출 지점이었다 — **채점하는 행위 자체가 같은 전제 위반**이다.
  #    그래서 이전 범위에 포함됐다 (MARA 사전 등록 §3③, ADR-018).
  # ⚠️ judge 와 후보가 같은 모델이 되어 **자기 선호 편향**이 생긴다. 이 점수는
  #    참고값이고 합격 판정은 통제어휘 이탈률·structured output 실패율이 한다.
  judge_model: "gemma-4-31B-it"
  # 롤백용 벤더 judge 모델. `judge_model` 이 계속 정본이고 이건 그 짝이다 (F1).
  judge_vendor_model: "claude-opus-5"
  golden_set_path: "eval/golden_set"
  scores_path: "eval/scores"
  # 아래 임계값 미달이면 파이프라인이 경고를 남긴다 (초안값, 측정 후 재조정)
  thresholds:
    field_accuracy: 0.90         # 통제어휘 필드 정확도
    summary_faithfulness: 4.0    # LLM-judge 1~5 평균

# --- 7. 관측(observability) ---------------------------------------------------
observability:
  # false 로 두면 NullObserver 로 폴백한다. 관측을 끄는 것이 파이프라인을 끄는
  # 것이 되어서는 안 된다 (D-008).
  enabled: true
  # 프로젝트 루트 기준 상대 경로. logs/ 는 .gitignore 대상이라 커밋되지 않는다.
  log_dir: "observability/logs"
  # 게이트가 버린 항목. **append-only 감사 로그** — 한 줄이 한 사건이다 (D-036).
  skips_filename: "skips.jsonl"
  # 정규화 실패한 기업/기관 표기. **이름당 한 줄로 upsert 하는 작업 큐**다.
  # occurrence_count 로 정렬해 company_aliases 에 무엇을 넣을지 정한다 (D-036).
  unknown_companies_filename: "unknown_companies.jsonl"
