# =============================================================================
# ai-news-ontology 설정
# -----------------------------------------------------------------------------
# 여기에는 "비밀이 아닌" 설정만 둔다. API 키·Vault 경로 등은 .env 로 분리한다.
#
# [중요] 통제어휘(controlled_vocabulary)의 단일 출처(SSoT)는
#        extraction/schema.py 의 Enum 이다. 아래 목록은 사람이 읽고 리뷰하기
#        위한 미러이며, tests/test_vocab_sync.py 가 두 곳의 일치를 검증한다.
#        → 어휘를 바꿀 때는 반드시 schema.py 와 이 파일을 함께 수정할 것.
#        (근거: README 결정 로그 D-002)
# =============================================================================

version: 1

# --- 1. 수집 소스 ------------------------------------------------------------
sources:
  rss:
    # - name: 사람이 읽는 이름 / url: 피드 주소 / tags: 기본 힌트 태그
    #   body_quality: full | truncated | oneline | partial | title_only
    #
    # body_quality 는 2026-08-29 실측값이다. 소스당 50건(arXiv 는 20건)을
    # collectors.rss 로 수집해 body 길이의 중앙값을 잰 결과:
    #
    #   소스                     건수  최소   중앙   최대  0자
    #   arXiv cs.CL (Atom API)    20   979   1339  1895    0
    #   GeekNews                  50    48    160   185     0
    #   OpenAI News               50   109    149   180     0
    #   Google DeepMind Blog      50     0     97   210    15
    #   Hugging Face Blog         50     0      0     0    50
    #
    # → 벤더 블로그 피드는 본문을 거의 주지 않는다. 결정 로그 D-013 / D-014 참고.

    # arXiv Atom API. RSS 공지 피드(rss.arxiv.org)는 주말/공휴일에 0건이라
    # 슬라이스 검증에 못 쓴다. API 쿼리는 언제든 최근 논문 + 초록 전문을 준다.
    - name: "arXiv cs.CL (Atom API)"
      url: "http://export.arxiv.org/api/query?search_query=cat:cs.CL&sortBy=submittedDate&sortOrder=descending&max_results=20"
      tags: ["paper"]
      body_quality: "full"        # 초록 전문, 중앙값 1339자

    - name: "OpenAI News"
      url: "https://openai.com/news/rss.xml"
      tags: ["vendor"]
      body_quality: "oneline"     # 한 줄 설명, 중앙값 149자

    - name: "Google DeepMind Blog"
      url: "https://deepmind.google/blog/rss.xml"
      tags: ["vendor"]
      body_quality: "partial"     # 중앙값 97자, 50건 중 15건은 0자. 편차가 크다

    - name: "Hugging Face Blog"
      url: "https://huggingface.co/blog/feed.xml"
      tags: ["oss"]
      body_quality: "title_only"  # 50건 전부 0자

    # 한국어 기술 뉴스 애그리게이터. title_only 피드가 많은 상황에서
    # 본문 커버리지를 보강할 목적으로 추가. 결정 로그 D-014 참고.
    # 주의: AI 전용 소스가 아니다(최근 50건 중 AI 관련 약 60%). 온톨로지가
    #       AI 어휘만 갖고 있으므로 비-AI 항목 필터링이 필요하다.
    - name: "GeekNews"
      url: "https://news.hada.io/rss/news"
      tags: ["ko", "aggregator"]
      body_quality: "truncated"   # 중앙값 160자, 0자 없음. 50건 중 40건이 말줄임으로 잘림

    # Anthropic News: rss.xml / news/rss.xml / news/feed.xml 모두 404 (2026-08-29 확인).
    # 공개 피드 주소를 확인한 뒤 추가한다.
    # TODO: 한국어 소스(예: AI타임스) 추가 검토

  arxiv:
    # arXiv API 로 최근 N일 논문을 가져올 카테고리
    categories:
      - "cs.CL"   # Computation and Language
      - "cs.LG"   # Machine Learning
      - "cs.AI"   # Artificial Intelligence
      - "cs.IR"   # Information Retrieval (RAG 관련)
      - "cs.MA"   # Multiagent Systems
    lookback_days: 3
    max_results_per_category: 50

# --- 2. LLM ------------------------------------------------------------------
# 단계별로 모델을 따로 지정한다. 파이프라인 앞단(relevance_gate)은 "분석할 가치가
# 있는가"만 판정하므로 저비용 모델로 충분하고, 뒷단(extraction)은 통제어휘 선택과
# 영향도 판정이 걸려 있어 고성능 모델을 쓴다. (결정 로그 D-015)
llm:
  provider: "anthropic"          # 추후 확장 지점. extraction/llm.py 의 Protocol 참고

  relevance_gate:
    model: "claude-haiku-4-5-20251001"
    max_tokens: 1000
    # Haiku 4.5 는 output_config.effort 를 지원하지 않는다(400). null 로 두면
    # AnthropicClient 가 output_config 를 아예 보내지 않는다.
    effort: null
    thinking: "disabled"         # 이분 판정이라 사고 확장이 필요 없다

  extraction:
    model: "claude-opus-5"
    max_tokens: 8000
    thinking: "adaptive"         # 구조화 추출은 판단이 섞이므로 기본 on
    effort: "high"

# --- 3. 온톨로지 통제어휘 (schema.py Enum 의 미러) -----------------------------
ontology:
  tech_domain:                   # 기술영역 — 고정 리스트, 1~3개 선택
    - LLM
    - Multimodal
    - RAG
    - Agent
    - Reasoning
    - Training/Finetuning
    - Inference/Serving
    - Infra/MLOps
    - Eval/Governance
    - Safety/Alignment
    - Data/Synthetic
    - Embodied/Robotics
    - Hardware/Chip
    - Application/Product

  release_type:                  # 발표유형 — 고정 리스트, 정확히 1개
    - Paper
    - ProductLaunch
    - OpenSource
    - Policy/Regulation
    - Funding/M&A
    - Benchmark/Report
    - Community/Discussion       # 2026-08-29 추가. 결정 로그 D-021

  impact:                        # 영향도 — 1~5 리커트, 근거 한 줄 병기
    scale: [1, 2, 3, 4, 5]
    require_rationale: true

# --- 4. 기업명 정규화 (alias -> canonical) ------------------------------------
# 관련기업은 자유 엔티티지만, 표기 흔들림을 여기서 흡수한다.
# 조회는 소문자·공백제거 후 매칭한다. 미등록 표기는 원문 그대로 보존하고
# observability 에 unknown_company 로 기록해 주기적으로 이 목록에 반영한다.
company_aliases:
  Anthropic: ["anthropic", "앤트로픽"]
  OpenAI: ["openai", "open ai", "오픈AI", "오픈에이아이"]
  Google DeepMind: ["deepmind", "google deepmind", "구글 딥마인드", "딥마인드"]
  Meta: ["meta", "meta ai", "facebook", "fair", "메타"]
  Microsoft: ["microsoft", "msft", "마이크로소프트"]
  NVIDIA: ["nvidia", "엔비디아"]
  Mistral AI: ["mistral", "mistral ai", "미스트랄"]
  Hugging Face: ["huggingface", "hugging face", "허깅페이스"]

# --- 5. 출력 ------------------------------------------------------------------
output:
  # .env: OBSIDIAN_VAULT_PATH 기준 상대 경로. 비워 두면 그 경로에 바로 쓴다.
  # OBSIDIAN_VAULT_PATH 가 노트 디렉터리를 직접 가리키면 비워 둔다.
  vault_subdir: ""
  # {date}=YYYY-MM-DD(처리 시각) {source}=소스명 슬러그 {slug}=제목 슬러그
  filename_template: "{date}-{source}-{slug}.md"
  # 같은 기사(source_url 일치) 노트가 이미 있을 때: skip | overwrite | version
  # 기본은 skip. Vault 는 사용자의 실제 데이터라 덮어쓰기는 명시적으로만. (D-028)
  # 제목이 비슷해 슬러그만 겹치는 경우는 별개 노트이므로 -2, -3 이 붙는다.
  on_conflict: "skip"

# --- 6. eval -----------------------------------------------------------------
eval:
  judge_model: "claude-opus-5"
  golden_set_path: "eval/golden_set"
  scores_path: "eval/scores"
  # 아래 임계값 미달이면 파이프라인이 경고를 남긴다 (초안값, 측정 후 재조정)
  thresholds:
    field_accuracy: 0.90         # 통제어휘 필드 정확도
    summary_faithfulness: 4.0    # LLM-judge 1~5 평균
